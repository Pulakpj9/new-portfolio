# Weekly chat evals + on-demand runs.
# Needs repo secret CHAT_API_KEY (server-side key for the dev server).
# Advisory, not a gate: LLMs vary — investigate failures in the job logs.

name: chat-evals

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHAT_API_KEY: ${{ secrets.CHAT_API_KEY }}
      CHAT_MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start dev server
        run: |
          npm run dev -- --port 3000 > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ >/dev/null 2>&1 && break
            sleep 5
          done
      - name: Run evals
        run: npm run eval:chat
      - name: Server logs (on failure)
        if: failure()
        run: tail -n 200 dev.log
